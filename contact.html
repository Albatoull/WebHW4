<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Albatoul Alharbi</title>
    <link rel="icon" type="image/png" href="LOGO.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body id="top">

    <header>
        <div class="top-bar">
            <a class="brand" href="index.html">
                <img src="LOGO.png" alt="Website logo">
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="cv.html">CV</a>
                <a href="projects.html">Projects</a>
                <a class="active" href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="contact-box">

            <aside class="contact-card">
                <h1>Contact Me</h1>
                <p>I am happy to connect about projects, study, and technology.</p>

                <h2>Contact Information</h2>

                <ul class="info-list">
                    <li>Location: Riyadh, Saudi Arabia</li>
                    <li>Availability: Open for academic and professional communication</li>
                </ul>
            </aside>

            <section class="form-card">

                <h2>Send a Message</h2>

                <form action="thankyou.html" method="get" onsubmit="return validateForm()">

                    <div>
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div>
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" cols="30" required></textarea>
                    </div>

                    <input type="submit" value="Send Message">

                </form>
            </section>
        </section>

        <a class="back-top" href="#top">Back to Top</a>

    </main>

    <footer>
        <p>© 2026 Albatoul Alharbi</p>
    </footer>

    <script src="scripts.js"></script>
</body>

</html>
